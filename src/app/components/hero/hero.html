<div #heroWrapper class="hero-scroll">
  <section class="hero" id="inicio">
    <video
      #scrubVideo
      class="hero-video"
      src="assets/video.mp4"
      poster="assets/hero-poster.jpg"
      preload="auto"
      muted
      playsinline
      tabindex="-1"
      aria-hidden="true"
      [class.is-hidden]="reverseActive() && reverseReady()"
    ></video>
    <video
      #scrubVideoRev
      class="hero-video"
      src="assets/video-reverse.mp4"
      preload="metadata"
      muted
      playsinline
      tabindex="-1"
      aria-hidden="true"
      [class.is-hidden]="!reverseActive() || !reverseReady()"
    ></video>
    <div class="hero-scrim" aria-hidden="true" [style.opacity]="textOpacity()"></div>
    <div class="container hero-content">
      <div class="hero-copy" [style.opacity]="textOpacity()">
        <p class="hero-overline" data-hero-animate="0">
          <i class="ph ph-barbell" aria-hidden="true"></i>
          Academia Stilus
        </p>
        <h1 class="display display-xl hero-title" data-hero-animate="1">
          Academia Stilus<br />
          <span class="hero-title-accent">Viva Stilus.</span>
        </h1>
        <p class="lead hero-sub" data-hero-animate="2">
          Musculação, treinamento funcional e aulas coletivas em Ilhéus.
          Estrutura completa com uma equipe de {{ teacherCount }} professores.
        </p>
        <div class="hero-actions" data-hero-animate="3">
          <a class="btn btn-yellow" href="#modalidades">Conheça as modalidades</a>
          <a class="btn btn-outline" [href]="whatsappUrl" target="_blank" rel="noopener">
            <i class="ph ph-whatsapp-logo" aria-hidden="true"></i>
            Fale no WhatsApp
          </a>
        </div>
      </div>
    </div>
  </section>
</div>
